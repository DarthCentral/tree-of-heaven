plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.example.worldroot'
archivesBaseName = 'worldroot'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run') }
        client { mods { worldroot { source sourceSets.main } } }
        server { mods { worldroot { source sourceSets.main } } }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    // Dynamic Trees is a required runtime companion; the addon currently uses
    // its own growth blocks so it does not link against unstable internals.
}

jar {
    manifest { attributes(['Specification-Title': 'worldroot', 'Specification-Vendor': 'Worldroot', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version]) }
}

jar.finalizedBy('reobfJar')
